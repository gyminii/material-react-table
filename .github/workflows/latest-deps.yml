name: Latest dependencies

# Builds the library against the newest published Material UI and TanStack releases
# so a breaking minor shows up here before a user reports it.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  latest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/material-react-table
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Bump Material UI and TanStack to latest
        run: |
          pnpm add @mui/material@latest @mui/icons-material@latest @mui/x-date-pickers@latest \
            @tanstack/react-table@latest @tanstack/react-virtual@latest @tanstack/match-sorter-utils@latest
          pnpm list @mui/material @mui/icons-material @mui/x-date-pickers @tanstack/react-table @tanstack/react-virtual @tanstack/match-sorter-utils --depth 0

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Build library
        run: pnpm lib:build

      - name: Build storybook
        run: pnpm storybook:build
