name: Deploy docs

# Builds the docs app with OpenNext and deploys the Worker defined in
# apps/material-react-table-docs/wrangler.jsonc. Needs the CLOUDFLARE_API_TOKEN
# repository secret (Workers Scripts: Edit, Workers Routes: Edit).

on:
  push:
    branches:
      - v4
    paths:
      - 'apps/material-react-table-docs/**'
      - 'packages/material-react-table/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/material-react-table-docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build with OpenNext
        run: pnpm cf:build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Deploy Worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
